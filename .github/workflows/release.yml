name: Release

# Publishes the DLL committed at the repository root as a GitHub release.
# Release notes are read from .github/release-notes/<tag>.md.
# Running it again for an existing tag updates that release's pre-release flag and notes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vMAJOR.MINOR.PATCH)
        required: true
        default: v2.0.0
      prerelease:
        description: Mark as a pre-release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like v1.2.3, got '$TAG'"
            exit 1
          fi
          if [[ ! -f ".github/release-notes/${TAG}.md" ]]; then
            echo "::error::missing .github/release-notes/${TAG}.md"
            exit 1
          fi

          plugins=dist/package/F4SE/Plugins
          mkdir -p "$plugins/CustomMeshesPathF4"
          cp CustomMeshesPathF4.dll CustomMeshesPathF4.ini CustomMeshesPathF4_Rules.txt "$plugins/"
          cp licenses/MinHook-LICENSE.txt "$plugins/CustomMeshesPathF4/"
          (cd dist/package && zip -r -X "../CustomMeshesPathF4-${TAG}.zip" F4SE)
          cp CustomMeshesPathF4.dll dist/
          unzip -l "dist/CustomMeshesPathF4-${TAG}.zip"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          # an existing release only gets its flags, title and notes updated; its tag and files stay as published
          if gh release view "$TAG" > /dev/null 2>&1; then
            flags=(--prerelease="$PRERELEASE")
            if [[ "$PRERELEASE" != "true" ]]; then
              flags+=(--latest)
            fi
            gh release edit "$TAG" \
              --title "CustomMeshesPathF4 ${TAG#v}" \
              --notes-file ".github/release-notes/${TAG}.md" \
              "${flags[@]}"
            exit 0
          fi

          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "CustomMeshesPathF4 ${TAG#v}" \
            --notes-file ".github/release-notes/${TAG}.md" \
            "${flags[@]}" \
            "dist/CustomMeshesPathF4-${TAG}.zip" \
            dist/CustomMeshesPathF4.dll
